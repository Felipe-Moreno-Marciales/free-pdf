name: Integración continua y despliegue

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Permisos mínimos por defecto; el trabajo de despliegue amplía los suyos.
permissions:
  contents: read

# Se cancelan las ejecuciones redundantes de una misma referencia, salvo en
# `main`, para no interrumpir un despliegue que ya esté en curso.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  VERSION_NODE: '24'
  RUTA_BASE: /free-pdf/

jobs:
  validar:
    name: Validar y compilar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.VERSION_NODE }}

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Analizar el código
        run: pnpm lint

      - name: Ejecutar las pruebas
        run: pnpm pruebas

      - name: Compilar la aplicación
        run: pnpm build

      - name: Comprobar la ruta base de GitHub Pages
        run: |
          if ! grep -qF "${RUTA_BASE}assets/" dist/index.html; then
            echo "::error file=vite.config.ts::La compilación no usa la ruta base ${RUTA_BASE}. Revisa la opción «base» de vite.config.ts."
            exit 1
          fi
          echo "La compilación usa la ruta base ${RUTA_BASE}."

      # Los recursos auxiliares de PDF.js se sirven desde la propia aplicación.
      # Si faltasen, PDF.js dejaría de representar bien las tipografías, los
      # alfabetos asiáticos y algunas imágenes, así que se comprueba que estén.
      - name: Comprobar los recursos locales de PDF.js
        run: |
          for carpeta in cmaps standard_fonts wasm iccs; do
            if [ ! -d "dist/pdfjs/${carpeta}" ]; then
              echo "::error file=compilacion/recursosPdfJs.ts::Falta dist/pdfjs/${carpeta}. Revisa el complemento «recursosPdfJs»."
              exit 1
            fi
            archivos=$(find "dist/pdfjs/${carpeta}" -type f | wc -l)
            if [ "${archivos}" -eq 0 ]; then
              echo "::error file=compilacion/recursosPdfJs.ts::dist/pdfjs/${carpeta} está vacía."
              exit 1
            fi
            echo "dist/pdfjs/${carpeta}: ${archivos} archivos."
          done

      # El motor de cifrado también viaja dentro del sitio, y no debe formar parte
      # del paquete inicial: solo se descarga al abrir Proteger o Desbloquear.
      - name: Comprobar el WebAssembly de qpdf
        run: |
          if ! ls dist/assets/qpdf-*.wasm >/dev/null 2>&1; then
            echo "::error file=src/seguridad/qpdf/recursosQpdf.ts::Falta el WebAssembly de qpdf en dist/assets."
            exit 1
          fi
          echo "qpdf: $(du -h dist/assets/qpdf-*.wasm | cut -f1)"

          inicial=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          for marca in qpdf callMain PDFDocument getDocument; do
            if grep -qF "${marca}" "dist/${inicial}"; then
              echo "::error::El paquete inicial contiene «${marca}»; debe cargarse de forma diferida."
              exit 1
            fi
          done
          echo "El paquete inicial no incluye qpdf, pdf-lib ni PDF.js."

      # La aplicación no debe pedir nada a una red de distribución de contenidos:
      # todos los recursos viajan dentro del sitio publicado.
      - name: Comprobar que no se usa ninguna CDN
        run: |
          if grep -rIlE 'unpkg\.com|cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com|mozilla\.github\.io/pdf\.js' dist; then
            echo "::error::La compilación referencia una CDN. Todos los recursos deben servirse desde el propio sitio."
            exit 1
          fi
          echo "No se referencia ninguna CDN."

      # El artefacto solo se prepara cuando va a desplegarse de verdad.
      - name: Preparar el artefacto de GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  desplegar:
    name: Desplegar en GitHub Pages
    # Solo se publica en los «push» a `main`; `development` nunca despliega.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v5
