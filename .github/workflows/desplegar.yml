name: Integración continua y despliegue

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Permisos mínimos por defecto; el trabajo de despliegue amplía los suyos.
permissions:
  contents: read

# Se cancelan las ejecuciones redundantes de una misma referencia, salvo en
# `main`, para no interrumpir un despliegue que ya esté en curso.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  VERSION_NODE: '24'
  RUTA_BASE: /free-pdf/

jobs:
  validar:
    name: Validar y compilar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.VERSION_NODE }}

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Analizar el código
        run: pnpm lint

      - name: Compilar la aplicación
        run: pnpm build

      - name: Comprobar la ruta base de GitHub Pages
        run: |
          if ! grep -qF "${RUTA_BASE}assets/" dist/index.html; then
            echo "::error file=vite.config.ts::La compilación no usa la ruta base ${RUTA_BASE}. Revisa la opción «base» de vite.config.ts."
            exit 1
          fi
          echo "La compilación usa la ruta base ${RUTA_BASE}."

      # El artefacto solo se prepara cuando va a desplegarse de verdad.
      - name: Preparar el artefacto de GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  desplegar:
    name: Desplegar en GitHub Pages
    # Solo se publica en los «push» a `main`; `development` nunca despliega.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v5
